<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Page 2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    #start {
      color: red;
      font-weight: bold;
    }
    .google-link a {
      color: blue;
    }
    .spacer {
      height: 600px; /* pushes "end" far down the page */
    }
    #end {
      color: red;
      font-weight: bold;
      text-align: right;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <p class="google-link"><a href="https://www.google.com" target="_blank">search using Google</a></p>
    <p id="start">start</p>
  </div>

  <div class="spacer"></div>

  <p id="end">end</p>

</body>
</html>
